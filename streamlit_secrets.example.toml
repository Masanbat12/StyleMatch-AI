SUPABASE_URL = "https://your-project-id.supabase.co"
SUPABASE_KEY = "your-publishable-or-anon-key"
SUPABASE_SERVICE_ROLE_KEY = "your-service-role-or-secret-key"

[llm]
# Free by default: a local Ollama model (no key, no account). Install Ollama, then: ollama pull qwen2.5:3b
provider = "ollama"            # ollama | groq | gemini | openrouter | custom
model = "qwen2.5:3b"
# api_key = ""                 # needed for groq / gemini / openrouter (each has a free tier)
# base_url = ""                # only for provider = "custom" (any OpenAI-compatible endpoint)

[supabase]
url = "https://your-project-id.supabase.co"
key = "your-publishable-or-anon-key"
service_role_key = "your-service-role-or-secret-key"
